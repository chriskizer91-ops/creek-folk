name: test
on:
  push:
  pull_request:
jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: node tools/build.mjs --dev
      - run: node tools/determinism.cjs 5
      - run: node tools/year.cjs --seeds 1 --days 10
