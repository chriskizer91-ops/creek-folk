<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Creekfolk 2</title>
<style>
  /* Fonts are embedded at build time (assets/fonts): the page never asks the network for anything. */
  /*@@FONTS@@*/
  /* The look of the chrome follows What the Water Brings: the valley fills the window, small dark chips float
     over it, and parchment sheets open over the play. */
  :root {
    --bg: #1b1a18; --ink: #f2efe9; --muted: #b5aea2; --line: rgba(242, 239, 233, 0.16); --chip: rgba(27, 26, 24, 0.82); --chip-solid: #2a2825;
    --accent: #ea7a2a; --gold: #c9a24e; --gold-d: #8f6d2a; --parch: #f3e9d2; --parch-ink: #3b2f22; --parch-mute: #7a6a52; --rule: #d9c9a4;
    --f-display: 'Gloock', 'Iowan Old Style', Georgia, serif;
    --f-body: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: #7fa6b0; color: var(--ink); font-family: var(--f-body); overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: none; overscroll-behavior: none; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden, [hidden] { display: none !important; }

  /* ---------- the chips */
  #hud { position: fixed; left: 0; right: 0; top: 0; z-index: 5; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); pointer-events: none; transition: opacity 1.2s; }
  #hud > * { pointer-events: auto; }
  body.ambient #hud, body.ambient #line { opacity: 0; }
  body.ambient #hud:hover, body.ambient #hud:focus-within { opacity: 1; }
  .lefthud { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; }
  .clock { margin: 0; padding: 6px 12px; border-radius: 999px; background: var(--chip); border: 1px solid var(--line); font: italic 400 14px/1.2 var(--f-display); color: var(--ink); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .sub { margin: 0; padding: 4px 10px; border-radius: 999px; background: var(--chip); border: 1px solid var(--line); font: 500 10.5px/1.3 var(--f-mono); letter-spacing: 0.08em; color: var(--muted); }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .ib { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); font: 600 12px/1 var(--f-body); }
  .ib svg { width: 20px; height: 20px; }
  .ib[aria-pressed="true"] { background: var(--ink); color: #1c1b1a; }
  .ib.dev { width: auto; padding: 0 12px; color: var(--gold); }
  #line { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 5; max-width: min(92vw, 640px);
    background: var(--chip); border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; font: 400 14px/1.35 var(--f-body); color: var(--ink); cursor: pointer; transition: opacity 1.2s; }
  #line .ago { color: var(--muted); font: 500 11px/1 var(--f-mono); margin-left: 6px; }
  #toast { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); z-index: 6; transform: translate(-50%, -8px); opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none;
    background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; font: italic 400 15px/1.3 var(--f-display); color: var(--ink); max-width: min(88vw, 520px); text-align: center; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #follow { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 5; display: flex; gap: 8px; align-items: center;
    background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 14px; font: 600 14px/1 var(--f-body); }

  /* ---------- dark panels: catch-up, questions, the dev menu */
  .veil { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(16, 14, 12, 0.55); }
  .veil:not([hidden]) > * { animation: rise 0.28s cubic-bezier(.2,.9,.25,1.1); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(0.98); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .veil:not([hidden]) > * { animation: none; } }
  .panel { position: relative; width: min(460px, 100%); max-height: calc(100% - 8px); overflow-y: auto; background: rgba(27, 26, 24, 0.95); border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px 18px; box-shadow: 0 20px 60px rgba(0,0,0,0.45); }
  .eyebrow { margin: 0; font: 500 10.5px/1.4 var(--f-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
  .panel h1 { margin: 6px 0 10px; font: 400 36px/1.04 var(--f-display); letter-spacing: -0.01em; text-wrap: balance; }
  .panel h2 { margin: 6px 0 12px; font: 400 26px/1.1 var(--f-display); }
  .panel p { margin: 0 0 12px; font: 400 15px/1.5 var(--f-body); color: #ddd6ca; max-width: 60ch; }
  .go { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { min-height: 44px; border-radius: 12px; padding: 0 16px; font: 600 15px/1 var(--f-body); cursor: pointer; border: 1px solid var(--line); background: var(--chip-solid); color: var(--ink); }
  .btn.gold { background: linear-gradient(180deg, #f1d58c, #d4ae5a); color: #2a2116; border-color: #8f6d2a; box-shadow: 0 3px 0 #6e5220; }
  .btn.small { min-height: 36px; font-size: 13px; padding: 0 12px; border-radius: 10px; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .x { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--chip-solid); color: var(--ink); font: 600 17px/1 var(--f-body); cursor: pointer; }
  .bar { height: 10px; border-radius: 999px; background: rgba(242, 239, 233, 0.12); overflow: hidden; margin: 6px 0 10px; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #d4ae5a, #f1d58c); border-radius: 999px; transition: width 0.25s; }
  .note { font: 500 11px/1.45 var(--f-mono) !important; color: var(--muted) !important; }
  .setrow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .setrow .lab { flex: none; width: 86px; font: 500 10px/1.3 var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { min-height: 34px; border-radius: 9px; padding: 0 11px; font: 500 13px/1 var(--f-body); cursor: pointer; border: 1px solid var(--line); background: var(--chip-solid); color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #1c1b1a; font-weight: 600; }
  input[type=datetime-local], input[type=file] { font: 500 13px/1 var(--f-mono); color: var(--ink); background: var(--chip-solid); border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; }
  .devpanel { width: min(560px, 100%); }
  .devpanel .seg button { min-height: 32px; font-size: 12.5px; }
  .snaps { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
  .snaps button { text-align: left; }

  /* ---------- parchment sheets: the village, a creekfolk's mind, settings */
  .parch { background: var(--parch); color: var(--parch-ink); border-radius: 16px; box-shadow: 0 0 0 3px var(--gold), 0 0 0 6px #3a2e1c, 0 24px 60px rgba(0,0,0,0.5); }
  .sheet { position: relative; width: min(720px, 100%); max-height: calc(100% - 16px); overflow-y: auto; padding: 20px 20px 18px; -webkit-user-select: text; user-select: text; }
  .sheet h2 { margin: 0 0 4px; font: 400 30px/1.1 var(--f-display); color: var(--parch-ink); }
  .sheet .k { margin: 0 0 12px; font: 500 10.5px/1.3 var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--parch-mute); }
  .sheet p, .sheet li { font: 400 15px/1.5 var(--f-body); color: #3b2f22; }
  .sheet h3 { margin: 16px 0 6px; font: 400 20px/1.2 var(--f-display); color: var(--parch-ink); }
  .sheet .x { background: #ead9b4; color: #3b2f22; border-color: #b89a5e; }
  .sheet .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
  .sheet .tabs button { min-height: 32px; border-radius: 9px; padding: 0 12px; font: 600 13px/1 var(--f-body); cursor: pointer; border: 1px solid #b89a5e; background: #ead9b4; color: #3b2f22; }
  .sheet .tabs button[aria-pressed="true"] { background: #3b2f22; color: var(--parch); }
  .sheet .mute { color: var(--parch-mute); }
  .sheet .who { cursor: pointer; text-decoration: underline; text-decoration-color: #b89a5e; text-underline-offset: 3px; }
  .sheet table { border-collapse: collapse; font: 400 14px/1.4 var(--f-body); }
  .sheet td { padding: 2px 10px 2px 0; vertical-align: top; }
</style>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
