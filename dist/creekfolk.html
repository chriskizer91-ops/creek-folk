:root { --ink: #2a1f2e; --paper: #fff8ec; --paper2: #f6ead4; --muted: #7a6c70; --accent: #2f7f86; --warm: #e07a5f; --ok: #3f8f4f; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #26315c; touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
body { font: 15px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: var(--ink); }
#view { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); image-rendering: pixelated; image-rendering: crisp-edges; display: block; cursor: grab; }
#view:active { cursor: grabbing; }
#hud { position: fixed; inset: 0; pointer-events: none; transition: opacity 1.2s ease; }
#hud > * { pointer-events: auto; }
body.ambient #hud { opacity: 0; }
body.ambient #hud, body.ambient #hud * { pointer-events: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
.chip { font-family: Pixelify, system-ui, sans-serif; background: rgba(255, 248, 236, 0.93); color: var(--ink); border: 2px solid var(--ink); border-radius: 10px; padding: 6px 11px; font-size: 15px; box-shadow: 0 3px 0 var(--ink); }
.topbar { position: absolute; top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.clock { display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 62vw; }
.clock .ttl { font-weight: 600; }
.clock .sep { opacity: .45; }
.clock .wx { font-family: system-ui; }
.btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.iconbtn { width: 42px; height: 42px; display: grid; place-items: center; background: rgba(255, 248, 236, 0.93); border: 2px solid var(--ink); border-radius: 10px; box-shadow: 0 3px 0 var(--ink); padding: 0; }
.iconbtn svg { width: 22px; height: 22px; }
.iconbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.iconbtn.on { background: var(--accent); color: var(--paper); }
.iconbtn.sm { width: 34px; height: 34px; box-shadow: none; }
.iconbtn.sm svg { width: 18px; height: 18px; }
.ticker { position: absolute; left: max(10px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); max-width: min(620px, calc(100% - 20px)); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: system-ui, sans-serif; font-size: 14px; }
.ticker small { color: var(--muted); margin-left: 4px; }
.warn { position: absolute; left: 50%; transform: translateX(-50%); top: 64px; background: #ffe0d6; font-family: system-ui; font-size: 13px; max-width: 90vw; }
.toast { position: absolute; left: 50%; transform: translateX(-50%); bottom: 70px; font-family: system-ui; font-size: 14px; background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 10px; }
.hidden { display: none !important; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 64vh; display: flex; flex-direction: column; background: rgba(255, 248, 236, 0.97); border-top: 2px solid var(--ink); border-radius: 18px 18px 0 0; box-shadow: 0 -4px 0 rgba(42, 31, 46, 0.25); padding: 12px 14px max(10px, env(safe-area-inset-bottom)); touch-action: pan-y; user-select: text; -webkit-user-select: text; }
@media (min-width: 760px) {
  .sheet { left: auto; right: 12px; top: 66px; bottom: 12px; width: 390px; max-height: none; border: 2px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink); }
}
.sh-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.sh-title { font-family: Pixelify, system-ui; font-weight: 600; font-size: 21px; line-height: 1.15; }
.sh-title.big { font-size: 32px; text-align: center; margin: 4px 0 6px; }
.sh-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.sh-body { overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; padding-right: 2px; }
.who { display: flex; gap: 10px; align-items: center; }
.dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink); flex: none; display: inline-block; }
.hbtns { display: flex; gap: 6px; align-items: center; }
.pill { font-variant-ligatures: none; font-family: Pixelify, system-ui; background: var(--paper2); border: 2px solid var(--ink); border-radius: 999px; padding: 6px 13px; font-size: 14px; }
.pill.on { background: var(--accent); color: var(--paper); }
.pill.danger { background: #fde1d9; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.btnrow.center { justify-content: center; margin-top: 12px; }
.tabs { display: flex; gap: 4px; margin: 0 0 8px; overflow-x: auto; flex: none; }
.tab { font-family: Pixelify, system-ui; background: transparent; border: 2px solid transparent; border-radius: 8px; padding: 4px 9px; font-size: 14px; color: var(--muted); white-space: nowrap; }
.tab.on { border-color: var(--ink); color: var(--ink); background: var(--paper2); }
h4 { font-family: Pixelify, system-ui; font-weight: 600; font-size: 15px; margin: 14px 0 4px; }
p { margin: 4px 0 8px; }
.doing { font-size: 17px; margin: 2px 0 6px; }
.muted { color: var(--muted); font-size: 13.5px; }
.small { font-size: 12px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 7px 2px; border-bottom: 1px dashed rgba(42, 31, 46, 0.18); cursor: pointer; }
.list li > span { flex: 1; min-width: 0; }
.list li > .dot { flex: none; }
.list li small { color: var(--muted); white-space: nowrap; font-size: 12px; }
.list li span small { white-space: normal; }
.list.creatures li { align-items: center; justify-content: flex-start; }
.list.log li.imp1 { opacity: 0.78; }
.list.log li.imp3 span { font-weight: 600; }
.bar { height: 8px; background: var(--paper2); border: 1.5px solid var(--ink); border-radius: 6px; overflow: hidden; margin: 4px 0; }
.bar i { display: block; height: 100%; background: var(--accent); }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin: 6px 0; }
.meter { font-size: 12px; color: var(--muted); }
.meter i { display: block; height: 6px; background: var(--warm); border-radius: 3px; margin-top: 2px; }
table.words { width: 100%; border-collapse: collapse; font-size: 14px; }
table.words td { padding: 5px 4px; border-bottom: 1px dashed rgba(42, 31, 46, 0.18); vertical-align: top; }
.word { font-family: Pixelify, system-ui; font-weight: 600; letter-spacing: .5px; text-transform: lowercase; }
.ok { color: var(--ok); font-size: 12px; }
label.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 2px; border-bottom: 1px dashed rgba(42, 31, 46, 0.18); }
label.row small { display: block; color: var(--muted); font-size: 12px; }
label.row input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
label.row select { font: inherit; padding: 4px 6px; border: 2px solid var(--ink); border-radius: 8px; background: var(--paper); }
.overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(26, 20, 32, 0.45); padding: 16px; z-index: 5; }
.card { background: var(--paper); border: 2px solid var(--ink); border-radius: 16px; box-shadow: 0 5px 0 var(--ink); padding: 16px; width: min(460px, 100%); max-height: 86vh; display: flex; flex-direction: column; }
.card.cu { text-align: center; }
.card.cu .bar { height: 12px; margin: 12px 0; }
.cu-label { color: var(--muted); }
.welcome p { font-size: 15px; }
.welcome .sh-body { overflow-y: auto; }
@media (max-height: 520px) {
  .card { max-height: 94vh; padding: 10px 14px; }
